name: CI

# Runs on every push and PR. These repos are PUBLIC, so GitHub Actions minutes
# are free — unlike the private Festro repos, which are dispatch-only to
# conserve quota. Keep it that way: if this repo ever goes private, switch the
# triggers below to `workflow_dispatch` first.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes the run in flight for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Everything runs against the bundled fixture catalog. CI never touches
    # api.festro.com — a red build must mean our code broke, not that someone
    # else's service was slow.
    env:
      FESTRO_MOCK: "1"
      MAJSQ_OPEN_AGUI: "1"
      DJANGO_SECRET_KEY: ci-only-not-a-real-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.8.4

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Migrations are committed
        # Catches the classic "model changed, migration forgotten" break, which
        # only shows up for the next person to run migrate.
        run: python manage.py makemigrations --check --dry-run

      - name: Django checks
        run: python manage.py check

      - name: Tests
        # There are no unit tests yet — they are Selene's task 5 in
        # docs/prompts/agent.md. `manage.py test` exits 0 on an empty suite, so
        # without this the step would report a confident green over nothing at
        # all. Print the count and say so until tests exist; the smoke test
        # below is what actually holds the line meanwhile.
        run: |
          out=$(python manage.py test 2>&1)
          echo "$out"
          if echo "$out" | grep -q "NO TESTS RAN"; then
            echo "::warning::No unit tests in this repo yet — the smoke test below is the only functional gate."
          fi

      - name: Smoke — a real conversation end to end
        # A green suite can still mean an app broken at the seams, so drive the
        # real HTTP contract once.
        #
        # It follows the conversation rather than assuming a fixed number of
        # turns: with a wide category the agent asks one narrowing question
        # before answering, which is by design. The guarantee worth asserting
        # is that the conversation TERMINATES IN PICKS, not that it takes
        # exactly two turns — the first version of this test hard-coded two and
        # failed on the agent behaving correctly.
        run: |
          python manage.py migrate --noinput
          python manage.py runserver 8000 --noreload &
          for i in $(seq 1 30); do
            curl -sf localhost:8000/healthz > /dev/null && break
            sleep 1
          done
          curl -sf localhost:8000/healthz > /dev/null

          python - <<'PY'
          import json
          import urllib.request

          BASE = "http://localhost:8000/api/turn/"

          def turn(**body):
              payload = {
                  "channel": "web", "kind": "web",
                  "conversation_id": "ci", "participant_id": "ci",
                  "locale": "fr",
                  **body,
              }
              request = urllib.request.Request(
                  BASE, data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          reply = turn(text="quoi faire ce week-end?")
          asked = []

          # Answer whatever it asks, at most four times, then insist on picks.
          for _ in range(4):
              question = reply.get("question")
              if not question:
                  break
              assert question["options"], f"question with no options: {question}"
              asked.append(question["name"])
              # Take the first real option; "" means "no preference".
              choice = next(
                  (o["value"] for o in question["options"] if o["value"]),
                  question["options"][0]["value"],
              )
              reply = turn(text="", chosen={question["name"]: choice})

          assert not reply.get("question"), f"still asking after 4 answers: {asked}"
          picks = reply.get("picks")
          assert picks, f"conversation ended with no picks (asked: {asked})"
          assert reply.get("share_id"), "picks without a map share id"

          for pick in picks:
              assert pick.get("title"), f"pick with no title: {pick}"
              # The rule that must never regress: artwork is licensed to Festro
              # for its own pages and must not travel into a chat or a share.
              leaked = [k for k in pick if "image" in k or "photo" in k]
              assert not leaked, f"artwork field leaked into a pick: {leaked}"

          print(f"  asked {asked or ['nothing']}, returned {len(picks)} picks, no artwork")
          PY

  docker:
    # Proves the image the deploy workflow will build actually builds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: majsq-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
